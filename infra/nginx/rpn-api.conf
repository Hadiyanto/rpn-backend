# Nginx in front of the RPN backend container (docker-compose.yml publishes it on 127.0.0.1:4000).
# Copy to /etc/nginx/conf.d/ (or sites-available + symlink), set server_name, then:
#   sudo nginx -t && sudo systemctl reload nginx
# Point NEXT_PUBLIC_API_URL (frontend) at https://<server_name> and add the frontend origin to
# CORS_ORIGINS / DOCKER_CORS_ORIGINS in rpn-backend/.env.

server {
    listen 80;
    listen [::]:80;

    server_name api-rpn.ruangin.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api-rpn.ruangin.xyz;

    ssl_certificate     /etc/nginx/ssl/api-server.pem;
    ssl_certificate_key /etc/nginx/ssl/api-server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Image uploads (menu/flavor photos, transfer proofs) are up to 5 MB; nginx's default is 1 MB.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend trusts one proxy hop (app.set('trust proxy', 1)) for the rate limiter.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
